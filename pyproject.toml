[project]
name = "adaptexts"
version = "0.1.0"
description = "A Framework for Adapters of Formal Contexts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.4.1",
    "pyyaml>=6.0.3",
    "cacheable>=0.1.3",
    "dateparser>=1.3.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "gitpython>=3.1.46",
    "conexp-clj-py",
    "certifi>=2026.5.20",
    "concepts>=0.9",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
cacheable = { git = "https://codeberg.org/thille/cacheable.git", rev = "0.1.3" }
conexp-clj-py = { git = "https://codeberg.org/thille/conexp-clj-py.git", rev = "0.1.5" }

[tool.ruff]
cache-dir = ".cache/ruff"
